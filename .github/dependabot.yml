# Weekly update proposals, one grouped PR per ecosystem. Each PR goes through
# the same required checks as any other. A release must be 7 days old before
# it is proposed: a hijacked release is usually yanked within that window.
version: 2
updates:
  - package-ecosystem: cargo
    # Two workspaces, two locks: the root's and x0ne Core's (x0ne-core/Cargo.lock). One entry
    # for both: every crate of x0ne Core's lock is in the root's at the same version
    # (ci/core-cpu.sh refuses otherwise), so a bump has to move the two together.
    directories:
      - /
      - /x0ne-core
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps land in one PR; majors stay separate for review.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Actions are pinned by SHA; one PR a week bumps them all together.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    # The two Go programs that made the transparency-log test data (x0ne-infer/tests/VENDORED.md):
    # nothing builds or ships them. A bump moves go.mod and go.sum only; the data is not made
    # again by it.
    directories:
      - /x0ne-infer/tests/tlog/go-src
      - /x0ne-infer/tests/tlog/tessera-src
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR a week for the module graphs of the two generators.
      gomod:
        patterns: ["*"]
  - package-ecosystem: docker
    # Dependabot reads a literal `FROM registry/image:tag@sha256:...` (ci/Containerfile.check,
    # .diffoscope, .valgrind). An image named by an
    # ARG (Containerfile, ci/Containerfile, ci/Containerfile.wasm) or in a workflow's env
    # (release.yml, security.yml) is not read by it and stays pinned by hand.
    directories:
      - /
      - /ci
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Base images are pinned by digest; one PR a week bumps them all together.
      docker:
        patterns: ["*"]
