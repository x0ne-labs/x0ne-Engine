# FEATURES.toml: the feature list of x0ne Engine, read by ci/features.py (FEATURES.md, make ci)
# and by the x0ne.co site. One [[feature]] per entry. Titles and sentences are written for a
# reader of the site: plain words; the technical names stay in proof, figure and limit.
#
# level: hardware (exercised on a TDX VM, in a run docs/hardware-runs.md dates), local (tests,
# CI or a machine without a TEE), prototype (code present, off the served path), planned
# (announced, not built), retired (replaced_by names the successor).
# since: the first proof (CHANGELOG, doc or test). hardware_since: the first run on real
# hardware that exercised it, a date of docs/hardware-runs.md. order: rank within its level.

# ---------------------------------------------------------------- hardware

[[feature]]
id = "attested-relay-path"
level = "hardware"
order = 1
since = "2026-10-12"
hardware_since = "2026-10-14"
version = "0.2.0-beta.2"
title_en = "The VM is verified before each question"
sentence_en = "A relay on your machine checks the VM's hardware proof before any question or key leaves your computer."
figure = "relay verdict in 1.2 s, key released and model ready 2.4 s later (2026-10-14); 10 recorded runs"
proof = "CHANGELOG 2026-10-12 (the attested channel); docs/hardware-runs.md, runs of 2026-10-14, 10-17, 10-18, 10-22, 10-25, 10-28, 10-30, 10-31, 11-01 and 11-04; README (VERIFIED on 10-18 qwen3:32b, 10-25 qwen3:0.6b, 10-28 ministral3:14b)"
limit = "Test relay only: debug assertions, TEST archive key and TEST log; no release key pinned, no published image. Not confidential against the host, which still sees timing, sizes and the model name."

