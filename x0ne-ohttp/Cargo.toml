[package]
name = "x0ne-ohttp"
description = "Prototype, not shipped: Oblivious HTTP (RFC 9458) client, relay and gateway for a shared x0ne service, so that no single server can be aimed at one user. No x0ne binary uses it."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["ohttp", "hpke", "privacy", "confidential"]
categories = ["cryptography", "network-programming"]
rust-version.workspace = true
publish.workspace = true

[dependencies]
# RFC 9458 and RFC 9292 by the RFC's author; pure-Rust HPKE (RustCrypto), no NSS.
# `stream` (chunked OHTTP) stays off until the draft is used.
ohttp = { version = "0.8.0", default-features = false, features = ["client", "server", "rust-hpke"] }
bhttp = "0.8.0"
sha2 = "0.11"
# Uniform draws from the OS generator (nodes.rs); already in the lock through ohttp.
getrandom = "0.4"
# IMF-fixdate of the inner `date` field (gateway.rs); already in the lock through hyper.
httpdate = "1.0.3"
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true

[dev-dependencies]
hex = "0.4"
# An independent RFC 9458 implementation in tests/rfc9458.rs; all already in the lock.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
hkdf = "0.13"
aes-gcm = "0.11"

[lints]
workspace = true
