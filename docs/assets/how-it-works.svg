<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">How x0ne Engine works</title>
  <desc id="d">Your application calls the relay on your machine. The relay checks the confidential VM's hardware proof, then talks to it over TLS 1.3 bound to that proof. The VM runs on Intel TDX in your Google Cloud project, with an NVIDIA H100 in confidential computing mode.</desc>
  <style>
    .bg{fill:#ffffff}.box{fill:#f6f8fa;stroke:#d0d7de}.acc{fill:#eef4ff;stroke:#2f5bd3}
    .zone{fill:none;stroke:#8c959f;stroke-dasharray:6 5}.ln{stroke:#57606a;stroke-width:1.6;fill:none}
    .h{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .s{font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57606a}
    .z{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57606a;letter-spacing:.06em}
    .a{fill:#57606a}.k{fill:#2f5bd3}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}.acc{fill:#13213f;stroke:#8fb3ff}
      .zone{stroke:#6e7681}.ln{stroke:#8b949e}.h{fill:#e6edf3}.s,.z{fill:#8b949e}.a{fill:#8b949e}.k{fill:#8fb3ff}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="a" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="bg" width="960" height="300" rx="12"/>
  <rect class="zone" x="16" y="30" width="400" height="210" rx="12"/>
  <text class="z" x="32" y="52">YOUR MACHINE</text>
  <rect class="zone" x="506" y="30" width="438" height="210" rx="12"/>
  <text class="z" x="522" y="52">YOUR GOOGLE CLOUD PROJECT</text>
  <rect class="box" x="34" y="80" width="150" height="110" rx="10"/>
  <text class="h" x="109" y="122" text-anchor="middle">Your application</text>
  <text class="s" x="109" y="144" text-anchor="middle">any OpenAI client,</text>
  <text class="s" x="109" y="162" text-anchor="middle">agent or script</text>
  <rect class="acc" x="230" y="80" width="168" height="110" rx="10"/>
  <text class="h" x="314" y="113" text-anchor="middle">x0ne-engine relay</text>
  <text class="s" x="314" y="136" text-anchor="middle">checks the proof:</text>
  <text class="s" x="314" y="154" text-anchor="middle">CPU, firmware, image,</text>
  <text class="s" x="314" y="172" text-anchor="middle">GPU, model</text>
  <rect class="acc" x="526" y="80" width="186" height="110" rx="10"/>
  <text class="h" x="619" y="113" text-anchor="middle">Confidential VM</text>
  <text class="s" x="619" y="136" text-anchor="middle">Intel TDX, memory</text>
  <text class="s" x="619" y="154" text-anchor="middle">encrypted by the CPU;</text>
  <text class="s" x="619" y="172" text-anchor="middle">signs each answer</text>
  <rect class="box" x="758" y="80" width="168" height="110" rx="10"/>
  <text class="h" x="842" y="122" text-anchor="middle">NVIDIA H100</text>
  <text class="s" x="842" y="144" text-anchor="middle">confidential</text>
  <text class="s" x="842" y="162" text-anchor="middle">computing mode</text>
  <path class="ln" d="M184 135H224" marker-end="url(#ar)"/>
  <path class="ln" d="M398 135H520" marker-end="url(#ar)"/>
  <path class="ln" d="M712 135H752" marker-end="url(#ar)"/>
  <text class="s" x="207" y="212" text-anchor="middle">loopback,</text>
  <text class="s" x="207" y="228" text-anchor="middle">your key</text>
  <text class="s k" x="461" y="212" text-anchor="middle">TLS 1.3 bound</text>
  <text class="s k" x="461" y="228" text-anchor="middle">to the proof</text>
  <text class="s" x="735" y="212" text-anchor="middle">encrypted</text>
  <text class="s" x="735" y="228" text-anchor="middle">CPU–GPU link</text>
  <text class="s" x="480" y="276" text-anchor="middle">No question and no session key leave your machine before the verdict is VERIFIED. Google still sees times, sizes, IP addresses and the bill.</text>
</svg>
