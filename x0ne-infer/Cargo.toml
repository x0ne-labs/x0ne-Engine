[package]
name = "x0ne-infer"
description = "x0ne Engine's confidential-native inference server: no proof, no socket; keys after proof; receipts."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["confidential", "attestation", "tdx", "inference", "llm"]
categories = ["cryptography", "science", "web-programming::http-server"]
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "x0ne-infer"
path = "src/main.rs"

# Pull, list, verify and remove catalog models (`src/registry`), and the
# `cloud` commands. Serves nothing itself.
[[bin]]
name = "x0ne-engine"
path = "src/bin/engine.rs"

# The cloud relay: runs on YOUR machine, verifies the TD's proof itself, then
# serves the OpenAI API on the loopback (`src/relay.rs`, `src/local_api.rs`).
[[bin]]
name = "x0ne-engine-proxy"
path = "src/bin/proxy.rs"

# The operator's tool for the log of image references (`src/tlog_ops.rs`):
# keys, appends, witness requests and cosignatures, proofs. Runs on the
# log operator's machine; no release archive ships it.
[[bin]]
name = "x0ne-engine-tlog"
path = "src/bin/tlog.rs"

[[example]]
name = "cloud_probe"
required-features = ["probe"]

[[example]]
name = "run_fixtures"
required-features = ["probe"]

[dependencies]
x0ne-confidential = { path = "../x0ne-confidential" }
# The OHTTP gateway of `/v2/e2e/*` (src/e2e_gateway.rs). No feature: the
# simulated root (`test-anchor`) comes only with the dev-dependency below.
x0ne-sdk = { path = "../x0ne-sdk" }
serde.workspace = true
# float_roundtrip: decision receipts re-serialize parsed f64s and compare them
# to the signed bytes; without it 107 of 1001 honest receipts were refused.
serde_json = { workspace = true, features = ["float_roundtrip"] }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2 = "0.11"
# OpenPGP v4 fingerprints (`openpgp.rs`): the archive key is pinned by one.
sha1 = "0.11"
zeroize = "1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
x509-parser = "0.18.1"
p384 = { version = "0.14.0", features = ["ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
base64.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
aes-gcm = "0.11"
# HPKE (RFC 9180) of a model key to the TD's attested key (`hpke.rs`): X25519 and
# HMAC for HKDF, both already in the lock (through ed25519-dalek and the RustCrypto stack).
curve25519-dalek = "5.0.0"
hmac = "0.13"
axum.workspace = true
reqwest.workspace = true
# The attested channel (`tls.rs`): TLS 1.3 terminated in the TD, both ends
# pinned by SPKI. `ring` only: aws-lc-rs is not in the lock.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
# Ephemeral P-256 certificates for both ends of the attested channel.
rcgen = "0.14.9"
libloading = { version = "0.9", optional = true }
# candle 0.11, the reference of the tests on the CPU (feature `candle-reference`):
# never in `cuda`, never in a release build (`tests/served_build.rs`).
candle-core = { version = "0.11.0", optional = true }
# The one candle already uses: shard headers checked (`shards.rs`), `merge-shards`.
safetensors = "0.8"
# Read-only maps of the weight files (`fsread::map_capped`); already in the lock through candle.
memmap2 = "0.9"
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = "0.23.1"
# The draws of `sampler.rs`: candle 0.11's StdRng and WeightedIndex, the rand
# candle already uses (no crate added to the lock).
rand = "0.9.5"
# x0ne Core, the backend `core` (`x0ne-core/`, its PROVENANCE.md): with
# `cuda` only, its kernels are compiled by nvcc.
x0ne-core-runtime = { path = "../x0ne-core/runtime", optional = true }
# The model catalog (catalog/models.toml), parsed by src/registry/catalog.rs.
toml = "0.8"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / O_NONBLOCK for reading model files (`fsread.rs`), prctl and
# rlimits (`harden.rs`, the relay).
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Paused time for the turn tests (`padding.rs`): a feature of tokio, no crate added.
tokio = { workspace = true, features = ["test-util"] }
# Tests only (resolver 2): lets the tests ATTEMPT 0-RTT against the TD's config.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "early-data"] }
# Enables `test-archive-key` for tests, examples and the binaries they run;
# only a debug build pins the TEST key with it (`archive_key.rs`). Enables
# `candle-reference` the same way: the tests have candle on the CPU, a build
# does not. `cargo build --release` does not see dev-dependencies.
x0ne-infer = { path = ".", features = ["test-archive-key", "candle-reference"] }
# The SDK prototype, checked against the simulated TD (src/e2e_sdk_tests.rs);
# `test-anchor` lets its C ABI take the simulated Intel root.
x0ne-sdk = { path = "../x0ne-sdk", features = ["test-anchor"] }

[features]

# candle 0.11 on the CPU, the REFERENCE of the tests: the oracle of the
# stepped loop and of the sampler, the small CPU model of the server,
# conformance and the simulated TD's tests. The dev-dependency on this crate
# turns it on for `cargo test`; `cargo build` never has it, and `cuda` never
# implies it: the served binary carries no candle (`tests/served_build.rs`).
candle-reference = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

# The real-hardware run's measuring client (`src/cloud_probe.rs`,
# `examples/cloud_probe.rs`, `scripts/e2e-cloud.sh probe`). Never in a release.
probe = []

# Pins a TEST archive key, from public strings, in a debug build only; without
# debug assertions the build keeps `RELEASE` (make ci step test-release:
# `cargo test --release -p x0ne-infer`). Enabled by the dev-dependency above.
test-archive-key = []

# GPU evidence collection over NVML (dlopen at runtime). Off by default: the
# code compiles everywhere, but only a CC GPU can make it succeed, and the
# binary without it still refuses cleanly (fail-closed) instead of lying.
nvml = ["dep:libloading"]

# Inference INSIDE the confidential GPU, through x0ne Core (`core_backend`,
# `x0ne-core/`), the backend of the attested server. Off by default because
# Core's kernels are compiled by nvcc: a build without it must not offer the
# GPU at runtime, it must not have it. With it the weights, activations and
# KV-cache cross the encrypted PCIe channel into the GPU's protected region,
# so the attested device is the one that holds the client's asset. Core's
# kernels are cubins only (`x0ne-core/kernels/build.rs`), no PTX.
cuda = ["dep:x0ne-core-runtime"]

[lints]
workspace = true
