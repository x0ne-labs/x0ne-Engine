# The x0ne model catalog: what `x0ne-engine pull <name>` may download.
#
# Every entry pins a Hugging Face commit (40 hex) and the size and sha256 of
# each file it takes. `pull` refuses a file whose bytes differ, before the
# model becomes usable. Only safetensors weights, JSON configs and licence
# texts are accepted: no pickle (.bin, .pt), no Python, no remote code.
#
# Each digest was measured by downloading the file at the pinned revision on
# the date written in `measured`, and cross-checked against the LFS sha256
# the Hub API publishes where it publishes one. To add an entry: same
# procedure, then `cargo test -p x0ne-infer registry` (the catalog is parsed
# and validated by the tests, and again by the binary at start-up).
#
# digest_sha256 is the served-model digest (v2, docs/cloud.md): the sha256 of
# "x0ne-model-digest/2\n" followed by the sha256sum lines of config.json,
# tokenizer.json and the weights (model.safetensors, or the index and every
# shard), sorted by name; LICENSE and NOTICE are left out. It follows from the
# sha256s listed, and the parser refuses a pin that does not. Without it, cloud
# mode does not serve the entry.

