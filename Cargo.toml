[workspace]
members = ["x0ne-confidential", "x0ne-infer", "x0ne-engine-cloud", "x0ne-ohttp", "x0ne-sdk"]
# x0ne Core's crates, a path dependency of x0ne-infer under `cuda`: their
# kernels need nvcc, so they are a workspace of their own (x0ne-core/PROVENANCE.md).
exclude = ["x0ne-core"]
resolver = "2"

[workspace.package]
version = "0.2.0-beta.7"
edition = "2021"
# No license here: each crate states its own, as LICENSING.md maps them
# (tests/licensing.rs in x0ne-infer).
authors = ["x0ne"]
repository = "https://github.com/x0ne-labs/x0ne-Engine"
homepage = "https://x0ne.co/confidential-inference"
readme = "README.md"
# MSRV = the toolchain of Containerfile and rust-toolchain.toml; older ones are untested.
rust-version = "1.98"
publish = false

[workspace.dependencies]
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
thiserror         = "2"
anyhow            = "1"
tracing           = "0.1"
tempfile          = "3"
axum              = { version = "0.8" }
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64            = "0.22"

[workspace.lints.rust]
# Set by x0ne-sdk/build.rs: x0ne-infer's pcs.rs, tcb.rs and nras.rs are compiled into x0ne-sdk
# too; x0ne_sdk_test_anchor only with its `test-anchor` feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(x0ne_sdk)', 'cfg(x0ne_sdk_test_anchor)'] }

[workspace.lints.clippy]
# Subjective design — refactoring is invasive and not always an improvement.
too_many_arguments = "allow"
type_complexity = "allow"
# Cosmetic rustdoc formatting.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
# Only occurrences are std::Mutex test-serialization locks held across .await in
# #[tokio::test]s (serialize tests touching global/env state) — benign, not prod.
await_holding_lock = "allow"
# ── Deferred style/idiom cleanups ────────────────────────────────────────────
# All verified non-correctness (no bugs). `cargo clippy --fix` already applied
# every machine-applicable suggestion; the rest need manual restructuring in
# core files, which isn't worth the regression risk right now. Tracked for
# incremental cleanup — chip these back to "warn" a file at a time.
needless_range_loop = "allow"
manual_clamp = "allow"
ptr_arg = "allow"
manual_strip = "allow"
sliced_string_as_bytes = "allow"
while_let_loop = "allow"
unnecessary_filter_map = "allow"
redundant_locals = "allow"
if_same_then_else = "allow"
format_in_format_args = "allow"
assertions_on_constants = "allow"
wildcard_in_or_patterns = "allow"
single_match = "allow"
result_large_err = "allow"
manual_try_fold = "allow"
len_without_is_empty = "allow"
filter_next = "allow"
field_reassign_with_default = "allow"
collapsible_match = "allow"

# Dependencies optimized in dev and test builds: the 987 lib tests of x0ne-infer ran in 95 s, 35 s
# with this (cold cargo test, 3 runs each, 2026-10-30). Workspace members keep opt-level 0 and
# debug_assertions; no shipped binary is built with this profile.
[profile.dev.package."*"]
opt-level = 2

# The one profile of every delivered binary (ci/inside-deb.sh, scripts/sbom.sh,
# x0ne-OS scripts/pkg-engine.sh and pkg-infer-cuda.sh) and of the tests of make ci (step test-release):
# symbols and line tables that ci/strip-release.sh moves to a debug file found by build-id. What
# ships is stripped: a comment leaves its bytes unchanged (ci/comment-invariance.sh).
[profile.release]
debug = "line-tables-only"
strip = "none"
